services:
  # Web Service (React Frontend + Express Backend)
  - type: web
    name: vanguard-marketing
    env: node
    buildCommand: cd vanguard-launchpad-main && npm install && npm run build
    startCommand: cd vanguard-launchpad-main && node server/src/server.js
    healthCheckPath: /
    
    # Environment variables (add these in Render dashboard instead)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
