services:
  # Web Service (React Frontend + Express Backend)
  - type: web
    name: vanguard-marketing
    env: node
    buildCommand: cd vanguard-launchpad-main && npm install && npm run build
    startCommand: cd vanguard-launchpad-main && node server/src/server.js
    healthCheckPath: /
    
    # Environment variables (add these in Render dashboard instead)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_EMAIL
        value: vanguardmarketing123@gmail.com
      - key: DEFAULT_ADMIN_PASSWORD
        generateValue: true
      - key: DEFAULT_ADMIN_NAME
        value: Admin
      # Add your MongoDB Atlas connection string here
      - key: MONGODB_URI
        value: your-mongodb-atlas-connection-string
